name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/validate.mjs
      - run: node --test "addons/**/*.test.mjs"
      - run: node tools/build.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: mcaddons
          path: dist/*.mcaddon

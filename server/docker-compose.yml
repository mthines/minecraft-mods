# Bedrock Dedicated Server. Start it with ./start.sh (it picks the right setup for Linux or macOS).
services:
  bedrock:
    image: itzg/minecraft-bedrock-server:latest
    container_name: family-bedrock
    restart: unless-stopped
    # Linux: share the computer's network, so the server shows up under LAN Games.
    # macOS can't do this; start.sh adds docker-compose.mac.yml instead.
    network_mode: host
    volumes:
      - ./data:/data
    stdin_open: true # lets `docker attach family-bedrock` reach the server console
    tty: true
    environment:
      EULA: "TRUE" # you accept https://www.minecraft.net/eula by starting the server
      VERSION: "LATEST" # every device must run the same Minecraft version as the server
      SERVER_NAME: "Family Server"
      GAMEMODE: "survival"
      DIFFICULTY: "easy"
      MAX_PLAYERS: "10"
      ALLOW_CHEATS: "true" # needed for /function party and other commands
      ONLINE_MODE: "true" # players must sign in with a Microsoft account
      ALLOW_LIST: "false" # "true" = only the gamertags below can join
      # Any names here turn the allow list back on, e.g. "YourGamertag,KidGamertag1,KidGamertag2"
      ALLOW_LIST_USERS: ""
      OPS: "YourGamertag" # operators can run commands like /function party
      TEXTUREPACK_REQUIRED: "true" # sends the resource packs to everyone who joins
      # Players connect on TCP 19132, then play over one UDP port each from this range.
      # Keep at least one port per player (MAX_PLAYERS).
      SERVER_UDP_PORTS: "19140-19155"
      ENABLE_LAN_VISIBILITY: "true" # announces the server on UDP 7551
      CONTENT_LOG_CONSOLE_OUTPUT_ENABLED: "true" # script errors show up in `docker logs`, npm run watch, and Dash0
